AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Guerra de Clusters - acesso do Claude Code. Cria o usuario guerra-claude com permissao
  so para os recursos do projeto, e o limite de permissoes (permissions boundary) que todo
  papel criado pelo projeto precisa carregar. Implantar UMA vez, pelo console, com um login
  administrador, como pilha "acesso-guerra-de-clusters" (o nome NAO pode comecar com
  "guerra-", senao o proprio usuario conseguiria altera-la).

Resources:
  # Teto do que qualquer papel criado pelo projeto (ex.: o papel da Lambda) pode fazer,
  # mesmo que o template peca mais. Impede escalar privilegio criando um papel "admin".
  LimitePapeis:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: guerra-boundary
      Description: Limite de permissoes dos papeis criados pelas pilhas guerra-*
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TabelaDoJogo
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:aws:dynamodb:sa-east-1:${AWS::AccountId}:table/guerra-*
              - !Sub arn:aws:dynamodb:sa-east-1:${AWS::AccountId}:table/guerra-*/index/*
          - Sid: LogsDaLambda
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/aws/lambda/guerra-*
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/aws/lambda/guerra-*:*

  PoliticaImplantacao:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: guerra-deployer
      Description: Implantar, operar e remover as pilhas guerra-* em sa-east-1
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ---- Guarda-corpo: nada fora de Sao Paulo (us-east-1 so para servicos globais)
          - Sid: SomenteSaoPaulo
            Effect: Deny
            NotAction:
              - iam:*
              - cloudfront:*
              - budgets:*
              - ce:*
              - sts:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion: [sa-east-1, us-east-1]
          - Sid: NuncaRemoverLimite
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: "*"

          # ---- CloudFormation / SAM
          - Sid: PilhasDoProjeto
            Effect: Allow
            Action: cloudformation:*
            Resource:
              - !Sub arn:aws:cloudformation:sa-east-1:${AWS::AccountId}:stack/guerra-*/*
              - !Sub arn:aws:cloudformation:sa-east-1:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - !Sub arn:aws:cloudformation:sa-east-1:${AWS::AccountId}:changeSet/*/*
              - arn:aws:cloudformation:sa-east-1:aws:transform/Serverless-2016-10-31
          - Sid: CloudFormationLeitura
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListStacks
              - cloudformation:DescribeStacks
              - cloudformation:ListExports
            Resource: "*"

          # ---- Site estatico e artefatos do SAM
          - Sid: Buckets
            Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::guerra-*
              - arn:aws:s3:::guerra-*/*
              - arn:aws:s3:::aws-sam-cli-managed-default-*
              - arn:aws:s3:::aws-sam-cli-managed-default-*/*
          - Sid: CloudFront
            Effect: Allow
            Action: cloudfront:*
            Resource: "*"

          # ---- API, funcao e tabela
          - Sid: ApiGateway
            Effect: Allow
            Action: apigateway:*
            Resource: arn:aws:apigateway:sa-east-1::/*
          - Sid: Lambda
            Effect: Allow
            Action: lambda:*
            Resource: !Sub arn:aws:lambda:sa-east-1:${AWS::AccountId}:function:guerra-*
          - Sid: LambdaLeitura
            Effect: Allow
            Action:
              - lambda:GetAccountSettings
              - lambda:ListFunctions
            Resource: "*"
          - Sid: DynamoDB
            Effect: Allow
            Action: dynamodb:*
            Resource:
              - !Sub arn:aws:dynamodb:sa-east-1:${AWS::AccountId}:table/guerra-*
              - !Sub arn:aws:dynamodb:sa-east-1:${AWS::AccountId}:table/guerra-*/*
          - Sid: DynamoDBLeitura
            Effect: Allow
            Action:
              - dynamodb:ListTables
              - dynamodb:DescribeLimits
            Resource: "*"

          # ---- Papeis da Lambda: so com prefixo guerra- e SEMPRE com o limite acima
          - Sid: PapeisComLimite
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/guerra-*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref LimitePapeis
          - Sid: PapeisManutencao
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:DeleteRole
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRoleTags
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/guerra-*
          - Sid: PassarPapelSoParaLambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/guerra-*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: PapelDeServicoDoApiGateway
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName: ops.apigateway.amazonaws.com
          - Sid: LerOLimite
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource: !Ref LimitePapeis

          # ---- Observabilidade
          - Sid: Logs
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/aws/lambda/guerra-*
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/aws/lambda/guerra-*:*
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/guerra/*
              - !Sub arn:aws:logs:sa-east-1:${AWS::AccountId}:log-group:/guerra/*:*
          - Sid: LogsLeitura
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:GetQueryResults
              - logs:StopQuery
              - logs:DescribeQueries
            Resource: "*"
          - Sid: Metricas
            Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:ListDashboards
            Resource: "*"
          - Sid: Painel
            Effect: Allow
            Action:
              - cloudwatch:PutDashboard
              - cloudwatch:GetDashboard
              - cloudwatch:DeleteDashboards
            Resource: !Sub arn:aws:cloudwatch::${AWS::AccountId}:dashboard/guerra-*

          # ---- Custo e cotas
          - Sid: Orcamento
            Effect: Allow
            Action: budgets:*
            Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/guerra-*
          - Sid: OrcamentoLeitura
            Effect: Allow
            Action: budgets:ViewBudget
            Resource: !Sub arn:aws:budgets::${AWS::AccountId}:budget/*
          - Sid: CustoLeitura
            Effect: Allow
            Action:
              - ce:GetCostAndUsage
              - ce:GetCostForecast
            Resource: "*"
          - Sid: Cotas
            Effect: Allow
            Action:
              - servicequotas:GetServiceQuota
              - servicequotas:GetAWSDefaultServiceQuota
              - servicequotas:ListServiceQuotas
              - servicequotas:RequestServiceQuotaIncrease
              - servicequotas:GetRequestedServiceQuotaChange
              - servicequotas:ListRequestedServiceQuotaChangeHistory
              - servicequotas:ListRequestedServiceQuotaChangeHistoryByQuota
            Resource: "*"

  UsuarioClaude:
    Type: AWS::IAM::User
    Properties:
      UserName: guerra-claude
      ManagedPolicyArns:
        - !Ref PoliticaImplantacao
      Tags:
        - Key: projeto
          Value: guerra-de-clusters

Outputs:
  Usuario:
    Description: Crie a chave de acesso deste usuario no console (IAM > Usuarios > Credenciais de seguranca)
    Value: !Ref UsuarioClaude
  LimiteDePermissoes:
    Description: ARN que o template.yaml do jogo usa em PermissionsBoundary
    Value: !Ref LimitePapeis
